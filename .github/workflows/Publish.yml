name: Publish

concurrency:
    group: Publish-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

on:
    push:
        tags: ["Run/v*"]
    workflow_dispatch:
        inputs:
            publish_crates:
                description: "Publish prun to crates.io"
                type: boolean
                default: true

env:
    ADBLOCK: true
    ASTRO_TELEMETRY_DISABLED: 1
    AUTOMATEDLAB_TELEMETRY_OPTOUT: 1
    AZURE_CORE_COLLECT_TELEMETRY: 0
    CARGO_TERM_COLOR: always
    CHOOSENIM_NO_ANALYTICS: 1
    DIEZ_DO_NOT_TRACK: 1
    DO_NOT_TRACK: 1
    DOTNET_CLI_TELEMETRY_OPTOUT: 1
    DOTNET_INTERACTIVE_CLI_TELEMETRY_OPTOUT: 1
    ET_NO_TELEMETRY: 1
    GATSBY_TELEMETRY_DISABLED: 1
    GATSBY_TELEMETRY_OPT_OUT: 1
    GATSBY_TELEMETRY_OPTOUT: 1
    GRIT_TELEMETRY_DISABLED: 1
    HASURA_GRAPHQL_ENABLE_TELEMETRY: false
    HINT_TELEMETRY: off
    HOMEBREW_NO_ANALYTICS: 1
    INFLUXD_REPORTING_DISABLED: true
    ITERATIVE_DO_NOT_TRACK: 1
    NEXT_TELEMETRY_DEBUG: 1
    NEXT_TELEMETRY_DISABLED: 1
    NG_CLI_ANALYTICS: false
    NUXT_TELEMETRY_DISABLED: 1
    PIN_DO_NOT_TRACK: 1
    POWERSHELL_TELEMETRY_OPTOUT: 1
    SAM_CLI_TELEMETRY: 0
    STNOUPGRADE: 1
    STRIPE_CLI_TELEMETRY_OPTOUT: 1
    TELEMETRY_DISABLED: 1
    TERRAFORM_TELEMETRY: 0
    VCPKG_DISABLE_METRICS: 1

jobs:
    Test:
        name: Test
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Rust (stable)
              uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
              with:
                  toolchain: stable

            - name: Cache cargo
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cargo/registry/
                      ~/.cargo/git/
                      Target/
                  key: cargo-publish-test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-publish-test-${{ runner.os }}-

            - name: cargo test
              run: cargo test --release

    Publish:
        name: Publish prun
        needs: [Test]
        runs-on: ubuntu-latest
        environment: Release
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Setup Rust (stable)
              uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
              with:
                  toolchain: stable

            - name: Cache cargo
              uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
              with:
                  path: |
                      ~/.cargo/registry/
                      ~/.cargo/git/
                      Target/
                  key: cargo-publish-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
                  restore-keys: cargo-publish-${{ runner.os }}-

            - name: Build release
              run: cargo build --release

            # Decide whether to publish: always on tag push, opt-in on
            # manual dispatch (default true). Skips if the version is
            # already on crates.io (idempotent).
            - name: Determine publish plan
              id: plan
              run: |
                  if [[ "${{ github.event_name }}" == "push" ]]; then
                      echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  elif [[ "${{ inputs.publish_crates }}" == "true" ]]; then
                      echo "should_publish=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "should_publish=false" >> "$GITHUB_OUTPUT"
                  fi

                  VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
                  echo "version=$VERSION" >> "$GITHUB_OUTPUT"
                  if curl -sL "https://crates.io/api/v1/crates/prun/$VERSION" | grep -q '"num"'; then
                      echo "already_published=true" >> "$GITHUB_OUTPUT"
                      echo "Version $VERSION is already on crates.io — skipping."
                  else
                      echo "already_published=false" >> "$GITHUB_OUTPUT"
                  fi

            # `--allow-dirty` is needed because `cargo build --release`
            # above updates Cargo.lock, making the working tree dirty.
            - name: Publish to crates.io
              if: ${{ steps.plan.outputs.should_publish == 'true' && steps.plan.outputs.already_published == 'false' }}
              run: cargo publish --no-verify --allow-dirty
              env:
                  CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
